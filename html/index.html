<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graveyard Shift RP Dual Loading Screen</title>
  <link rel="stylesheet" href="dual-shell.css" />
</head>
<body>
  <div id="screenWrap" class="screen-wrap" aria-label="Loading screen design switcher">
    <iframe id="designTwopoint" class="design-frame" src="twopoint.html" title="Loading Screen Design One"></iframe>
    <iframe id="designGraveyard" class="design-frame" src="graveyard.html" title="Loading Screen Design Two"></iframe>
  </div>

  <div class="dual-controls" id="dualControls">
    <button id="designSwitch" class="design-switch" type="button">Switch Design</button>
  </div>

  <div class="shared-music" id="sharedMusicWidget">
    <div class="music-meta">
      <div class="music-kicker">Shared Music</div>
      <div class="track-title" id="sharedTrackTitle">Loading music…</div>
    </div>
    <button id="sharedPrev" class="music-btn" type="button" aria-label="Previous song">⏮</button>
    <button id="sharedPlayPause" class="music-btn primary" type="button" aria-label="Play or pause music">⏸</button>
    <button id="sharedNext" class="music-btn" type="button" aria-label="Next song">⏭</button>
    <input id="sharedVolume" class="volume" type="range" min="0" max="100" value="12" aria-label="Music volume" />
    <span class="volume-text" id="sharedVolumeText">12%</span>
  </div>

  <audio id="sharedAudio" preload="auto" playsinline></audio>

  <script src="shared-config.js"></script>
  <script src="dual-shell.js"></script>
</body>
</html>
